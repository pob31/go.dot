<?xml version="1.0" encoding="UTF-8"?>
<!--
    Go.dot's app icon for macOS, the small cut: 16 and 32 px. No grid,
    and a bigger stone and dot, because the full-detail dot is a pixel wide here.
    Source for scripts/make-icons.py, which renders every PNG, .icns and .ico
    from it; edit this, never the renders.
    SPDX-License-Identifier: GPL-3.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="stone" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F1EDE4"/>
      <stop offset="1" stop-color="#C4BCAB"/>
    </radialGradient>
  </defs>
  <rect x="100" y="110" width="824" height="824" rx="184" fill="#000000" fill-opacity="0.22"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#1C2226"/>
  <circle cx="408" cy="638" r="170" fill="#000000" fill-opacity="0.45"/>
  <circle cx="400" cy="624" r="170" fill="url(#stone)"/>
  <circle cx="672" cy="352" r="96" fill="#4CC38A"/>
</svg>
