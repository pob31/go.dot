name: Release

# THE TEST BUILD: three archives anybody can download, unpack and run, so that
# people other than the author can try Go.dot and say what they found. The
# `release.yml` ci.yml's header promised, kept apart from CI for the reason it
# gives: a packaging pipeline must never run on every push.
#
# SIGNING. macOS is signed with the author's Developer ID, notarized and
# stapled, as Go.dot.app in a DMG (the job `macos` and scripts/package-macos.sh
# say how). Windows is not signed yet: that needs a code-signing certificate
# nobody holds yet, and the Windows README.txt tells the tester how to get past
# SmartScreen meanwhile. Nothing here builds an installer.
#
# TWO WAYS IN:
#   * push a tag `vX.Y.Z` or `vX.Y.Z-anything` (v0.1.0-alpha.1, say). The three
#     archives are built and published as a GitHub PRE-release under that tag,
#     with the commits since the last one listed under it. X.Y.Z must be the
#     root CMakeLists.txt's project VERSION, which is what `wfg --version`
#     prints - the job `meta` refuses a tag that disagrees, before any compile
#     minute is spent.
#   * run it by hand (Actions > Release > Run workflow) on any branch. The same
#     three archives, uploaded to the run as artifacts for 14 days and published
#     nowhere: the way to hand a branch to one tester, or to check this file
#     still works before tagging.
#
# WHAT IT CHECKS. Not the test suite: CI ran that on the commit being tagged,
# and building it again would put lxml back into a build that does not need it.
# Instead every job tests what it is about to ship - the INSTALLED binary, run
# from the staging folder: `--version`, `selftest`, and `validate` on the empty
# show the launcher opens. Plus one fact per platform that a runner cannot
# otherwise notice: the macOS binaries have both slices, the Windows folder
# carries the MSVC runtime (the runner has it installed; a tester may not).
#
# No compiler cache. Tags are rare, a cold Release build is what a release
# should be, and ci.yml's cache keys are Debug trees this would only evict.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two tags pushed together each get their run; a second run of the SAME ref waits
# rather than cancelling the first half-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The name every archive carries, and the pin gate - both before anything
  # compiles, so a mistyped tag or a skewed pin costs fifteen seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: version + pins
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # NON-recursive — see ci.yml's job `pins`

      - name: Populate juce_simpleweb's nested asio
        # The one scoped recursion; ci.yml's job `pins` says why it is scoped.
        run: git submodule update --init --recursive ThirdParty/juce_simpleweb

      - name: Check submodule pins
        run: python3 scripts/check-pins.py

      - name: Work out the version
        id: version
        shell: bash
        # The project VERSION is read out of the root CMakeLists.txt with the
        # same text a human would look for, so a reformatting of project() that
        # this misses fails here, loudly, rather than naming an archive "".
        run: |
          set -euo pipefail
          project=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9]\+\.[0-9]\+\.[0-9]\+\)[[:space:]]*$/\1/p' CMakeLists.txt | head -n1)
          if [ -z "$project" ]; then
            echo "::error::could not read project(... VERSION x.y.z) from CMakeLists.txt"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            base="${version%%-*}"
            if [ "$base" != "$project" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} says ${base}, but CMakeLists.txt says ${project} - and wfg --version prints the latter. Bump project(VERSION) or retag."
              exit 1
            fi
          else
            version="${project}-dev.$(git rev-parse --short=8 HEAD)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building go.dot-$version"

  # ---------------------------------------------------------------------------
  # Linux. ubuntu-24.04 by name rather than -latest: the image IS the glibc
  # floor a tester's machine must meet, and README.txt names it, so moving it is
  # a decision and not an image repoint.
  # ---------------------------------------------------------------------------
  linux:
    name: package (Linux x86_64)
    needs: meta
    runs-on: ubuntu-24.04
    env:
      PKG: go.dot-${{ needs.meta.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # NON-recursive — see ci.yml's job `pins`

      - name: Populate juce_simpleweb's nested asio
        run: git submodule update --init --recursive ThirdParty/juce_simpleweb

      - name: Install build deps
        run: bash scripts/install-linux-deps.sh

      - name: Configure
        run: cmake --preset package

      - name: Build (Release)
        run: cmake --build --preset package-release

      - name: Install into the staging folder
        # --component wfg: only what cmake/WfgInstall.cmake names. Without it,
        # JUCE's own install rules add thirty megabytes of its headers.
        run: cmake --install build/package --config Release --component wfg --prefix "stage/$PKG"

      - name: Smoke-test what ships
        shell: bash
        working-directory: stage/${{ env.PKG }}
        run: |
          set -euo pipefail
          ./wfg --version
          ./wfg selftest
          ./wfg validate Untitled
          ./wfg validate "Examples/Process examples"
          test -x go.dot.sh
          test -f console/index.html
          test -f pd/go.avg.pd
          # The two Try it out guides, by pattern: the French one's name has a c-cedilla.
          test "$(ls Go.dot_TryItOut_*.md | wc -l)" -eq 2

      - name: Archive
        # tar, not zip: it keeps the executable bits on wfg and go.dot.sh.
        run: tar -C stage -czf "$PKG.tar.gz" "$PKG"

      # The package (scripts/package-linux-deb.sh): the same folder in /opt,
      # plus the .wfg file type, the menu entry and the icons for everybody.
      - name: Build the package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bash scripts/package-linux-deb.sh "stage/$PKG" "$VERSION" "$PKG.deb"

      # What a tester's double-click relies on: apt installs it with its
      # dependencies, the desktop's databases know the type afterwards, the
      # installed copy runs - and removing it takes all of it away.
      - name: Smoke-test the package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends "./$PKG.deb"
          test -x /opt/go.dot/wfg
          test "$(readlink -f /usr/bin/go.dot)" = /opt/go.dot/go.dot.sh
          grep -q 'MimeType=application/x-go.dot-show;' /usr/share/applications/go.dot.desktop
          grep -q '<glob pattern="\*.wfg"/>' /usr/share/mime/packages/go.dot.xml
          test -f /usr/share/icons/hicolor/256x256/mimetypes/application-x-go.dot-show.png
          if [ -d /usr/share/mime/application ]; then
            test -f /usr/share/mime/application/x-go.dot-show.xml   # the trigger ran
          fi
          /opt/go.dot/wfg --version
          /opt/go.dot/wfg validate /opt/go.dot/Untitled
          sudo apt-get remove -y go.dot
          test ! -e /opt/go.dot
          test ! -e /usr/share/applications/go.dot.desktop
          test ! -e /usr/bin/go.dot

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.deb
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS, universal, as Go.dot.app in a DMG - signed with the Developer ID,
  # notarized and stapled by scripts/package-macos.sh, the way WFS-DIY's is.
  #
  # The five secrets live in the protected `go-dot` environment, which is why
  # this job - and only this one - names it. A tag MUST come out signed
  # (REQUIRE_SIGNED); a manual run with no secrets reachable - a fork, say -
  # still builds, ad hoc and unnotarized, and says so in its log.
  # ---------------------------------------------------------------------------
  macos:
    name: package (macOS universal)
    needs: meta
    runs-on: macos-latest
    environment: go-dot
    env:
      PKG: go.dot-${{ needs.meta.outputs.version }}-macos-universal
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_BASE64 != '' }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      REQUIRE_SIGNED: ${{ github.ref_type == 'tag' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # NON-recursive — see ci.yml's job `pins`

      - name: Populate juce_simpleweb's nested asio
        run: git submodule update --init --recursive ThirdParty/juce_simpleweb

      - name: Install ninja
        # The package presets inherit dev's Ninja Multi-Config generator.
        run: brew install ninja

      - name: Configure
        run: cmake --preset package-macos

      - name: Build (Release)
        run: cmake --build --preset package-macos-release

      - name: Install into the staging folder
        run: cmake --install build/package-macos --config Release --component wfg --prefix "stage/$PKG"

      - name: Smoke-test what ships
        # Before signing, so a failure here is the build's and not the
        # signature's. Everything is run from inside the bundle, as a tester
        # would.
        shell: bash
        working-directory: stage/${{ env.PKG }}
        run: |
          set -euo pipefail
          macos=Go.dot.app/Contents/MacOS
          for bin in "$macos/wfg" "$macos/Go.dot"; do
            archs=$(lipo -archs "$bin")
            echo "$bin slices: $archs"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice in $bin"; exit 1;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice in $bin"; exit 1;; esac
          done
          plutil -lint Go.dot.app/Contents/Info.plist
          # Every icon Info.plist names is in Resources under exactly that name:
          # a name without .icns went unfound once, and the app had no icon.
          for key in CFBundleIconFile UTExportedTypeDeclarations.0.UTTypeIconFile CFBundleDocumentTypes.0.CFBundleTypeIconFile; do
            icon=$(plutil -extract "$key" raw Go.dot.app/Contents/Info.plist)
            echo "$key: $icon"
            test -f "Go.dot.app/Contents/Resources/$icon" || { echo "::error::Info.plist $key names $icon, which is not in Resources"; exit 1; }
          done
          "$macos/wfg" --version
          "$macos/wfg" selftest
          "$macos/wfg" validate Go.dot.app/Contents/Resources/Untitled
          "$macos/wfg" validate "Go.dot.app/Contents/Resources/Examples/Process examples"
          test -f Go.dot.app/Contents/Resources/launch.sh
          test -f Go.dot.app/Contents/Resources/console/index.html
          test -f Go.dot.app/Contents/Resources/pd/go.avg.pd
          # Beside the app, as LICENSE is: the two Try it out guides, by pattern.
          test "$(ls Go.dot_TryItOut_*.md | wc -l)" -eq 2

      # WHAT macOS SAYS TO THE APP, tried the way a person does it, because
      # nothing else here can: the app registered with LaunchServices, a show's
      # .wfg opened with it as a Finder double-click opens it (`open -a`), and
      # then "quit" as Cmd-Q sends it. On the author's Mac mini both went past
      # Go.dot twice (2026-09-30) - the file refused, Cmd-Q quitting at once.
      # The log is the witness (launch.sh writes it; serve says who macOS's
      # delegate is, what was handed over at launch and which show it opened),
      # and it is printed whole whatever happens.
      - name: Probe a double-click and a quit
        shell: bash
        run: |
          set -uo pipefail
          app="$PWD/stage/$PKG/Go.dot.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          show="$RUNNER_TEMP/Probe Show"
          rm -rf "$show" ~/Library/Logs/Go.dot
          cp -R "$app/Contents/Resources/Untitled" "$show"
          mv "$show/Untitled.wfg" "$show/Probe Show.wfg"

          open -a "$app" "$show/Probe Show.wfg"
          for i in $(seq 1 30); do
            log=$(ls -t ~/Library/Logs/Go.dot/*.log 2>/dev/null | head -1)
            if [ -n "$log" ] && grep -q '^wfg: show ' "$log"; then break; fi
            sleep 1
          done
          sleep 5
          echo "--- the log after the double-click"; cat "$log" || true

          window_up=0; grep -q '^wfg: http ' "$log" && window_up=1
          osascript -e 'tell application id "com.github.pob31.godot" to quit' >/dev/null 2>&1 &
          sleep 5
          if pgrep -f 'MacOS/wfg serve' >/dev/null; then asked=1; else asked=0; fi
          echo "--- the log after quit"; cat "$log" || true
          pkill -f 'MacOS/wfg serve' || true

          failed=0
          grep -q "^wfg: handed over at launch: $show/Probe Show.wfg" "$log" \
            || { echo "::error::the double-clicked .wfg was not handed to Go.dot"; failed=1; }
          grep -q "^wfg: show $show\$" "$log" \
            || { echo "::error::Go.dot did not open the double-clicked show"; failed=1; }
          if [ "$window_up" = 1 ] && [ "$asked" = 0 ]; then
            echo "::error::quit ended Go.dot without asking"; failed=1
          fi
          exit $failed

      - name: Import the Developer ID certificate
        if: env.HAVE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Write the App Store Connect API key
        if: env.HAVE_NOTARY_KEY == 'true'
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary/AuthKey.p8"
          echo "NOTARY_API_KEY=$RUNNER_TEMP/notary/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sign, build the DMG, notarize, staple
        run: bash scripts/package-macos.sh "stage/$PKG" "$PKG.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.dmg
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows. windows-2025 for the reason ci.yml's windows job pins it.
  # ---------------------------------------------------------------------------
  windows:
    name: package (Windows x64)
    needs: meta
    runs-on: windows-2025
    env:
      PKG: go.dot-${{ needs.meta.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # NON-recursive — see ci.yml's job `pins`

      - name: Populate juce_simpleweb's nested asio
        run: git submodule update --init --recursive ThirdParty/juce_simpleweb

      - name: Configure
        run: cmake --preset package-windows

      - name: Build (Release)
        run: cmake --build --preset package-windows-release

      - name: Install into the staging folder
        run: cmake --install build/package-windows --config Release --component wfg --prefix "stage/$env:PKG"

      - name: Smoke-test what ships
        shell: pwsh
        working-directory: stage/${{ env.PKG }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner has the VC++ redistributable installed, so wfg.exe would
          # start here without these; a tester's machine may not.
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path $dll)) { throw "$dll is missing beside wfg.exe" }
          }
          if (-not (Test-Path 'Go.dot.exe')) { throw 'Go.dot.exe is missing' }
          if (-not (Test-Path 'console/index.html')) { throw 'console/ is missing' }
          if (-not (Test-Path 'pd/go.avg.pd')) { throw 'pd/ is missing' }
          # The two Try it out guides, by pattern: the French one's name has a c-cedilla.
          if (@(Get-ChildItem 'Go.dot_TryItOut_*.md').Count -ne 2) { throw 'a Try it out guide is missing' }
          foreach ($run in @(@('--version'), @('selftest'), @('validate', 'Untitled'), @('validate', 'Examples/Process examples'))) {
            & ./wfg.exe @run
            if ($LASTEXITCODE -ne 0) { throw "wfg $run exited $LASTEXITCODE" }
          }

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path "stage/$env:PKG" -DestinationPath "$env:PKG.zip"

      # The installer (packaging/windows/go.dot.iss): the same folder as the zip,
      # plus the .wfg file type, a Start menu entry and an uninstaller. Inno
      # Setup is on the runner image today; if an image drops it, Chocolatey is.
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          }
          & $iscc /Qp "/DStage=$PWD\stage\$env:PKG" "/DAppVersion=$env:VERSION" "/O$PWD" packaging\windows\go.dot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          if (-not (Test-Path "$env:PKG-setup.exe")) { throw "$env:PKG-setup.exe was not made" }

      # What a tester's double-click relies on: installed for this user, the
      # installed copy runs, a .wfg is a Go.dot show - and after the uninstall,
      # none of it is left. The uninstaller finishes from a copy of itself, so
      # the last check waits for it.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'go.dot-installed'
          $setup = Start-Process (Resolve-Path "$env:PKG-setup.exe") -Wait -PassThru `
                     -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          if ($setup.ExitCode -ne 0) { throw "setup exited $($setup.ExitCode)" }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\GoDot.Show\shell\open\command').'(default)'
          if ($command -notlike "*Go.dot.exe*") { throw "a .wfg does not open with Go.dot.exe: $command" }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.wfg').'(default)' -ne 'GoDot.Show') { throw '.wfg is not a GoDot.Show' }
          foreach ($run in @(@('--version'), @('validate', "$dir\Untitled"))) {
            & "$dir\wfg.exe" @run
            if ($LASTEXITCODE -ne 0) { throw "installed wfg $run exited $LASTEXITCODE" }
          }
          $uninstall = Start-Process "$dir\unins000.exe" -Wait -PassThru `
                         -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "uninstall exited $($uninstall.ExitCode)" }
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) {
            Start-Sleep -Seconds 1
            $gone = -not (Test-Path 'HKCU:\Software\Classes\GoDot.Show') -and -not (Test-Path "$dir\wfg.exe")
          }
          if (-not $gone) { throw 'the file type or the program outlived the uninstall' }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}-setup.exe
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish - tags only. All three or none: a release with the Windows archive
  # missing is a release somebody downloads the wrong thing from.
  # ---------------------------------------------------------------------------
  publish:
    name: publish the pre-release
    if: github.ref_type == 'tag'
    needs: [meta, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum go.dot-* | tee SHA256SUMS.txt

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        # --prerelease, always, until the author decides otherwise: nothing this
        # workflow makes is signed, and "Latest release" on the repo page should
        # not point a stranger at it. --generate-notes lists the commits since
        # the previous tag under the paragraph written here.
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          **A test build, not a release.** The macOS app is signed and notarized; the
          Windows and Linux builds are not signed. Each download's `README.txt` says
          how to start it.
          Please report what you find in the issues, with the download's name, your OS
          and audio device, and the log (its `README.txt` says where each system keeps it).

          | Platform | Archive |
          |---|---|
          | Windows 10/11 x64 | `*-windows-x64-setup.exe` — installs Go.dot and opens `.wfg` shows with it |
          | Windows 10/11 x64, no install | `*-windows-x64.zip` — unzip and run `Go.dot.exe` |
          | macOS 13.3+, Apple silicon and Intel | `*-macos-universal.dmg` — drag Go.dot to Applications |
          | Ubuntu 24.04 or newer, x86_64 | `*-linux-x86_64.deb` — `sudo apt install ./<file>.deb`, then Go.dot is in the applications menu and opens `.wfg` shows |
          | Linux x86_64, no install (glibc of Ubuntu 24.04 or newer) | `*-linux-x86_64.tar.gz` — run `./go.dot.sh` |
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Go.dot $VERSION (test build)" \
            --notes-file notes.md \
            --generate-notes \
            dist/go.dot-* dist/SHA256SUMS.txt
